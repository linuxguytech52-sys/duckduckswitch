<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google to DuckDuckGo Redirector</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            width: 200px;
            padding: 15px;
            background: #1a1a2e;
            color: white;
        }
        h2 {
            margin: 0 0 10px 0;
            font-size: 14px;
            color: #4cc9f0;
        }
        p {
            margin: 0 0 15px 0;
            font-size: 12px;
            color: #a0a0a0;
            line-height: 1.4;
        }
        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
        }
        .indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #00ff00;
        }
        .links {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #2a2a3e;
        }
        .links a {
            display: block;
            color: #4cc9f0;
            text-decoration: none;
            font-size: 11px;
            margin-bottom: 8px;
        }
        .links a:hover {
            text-decoration: underline;
        }
        .true-color-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 10px;
            background: #de5833;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .true-color-icon svg {
            width: 48px;
            height: 48px;
        }
    </style>
</head>
<body>
    <div class="true-color-icon">
        <svg viewBox="0 0 32 32" fill="white">
            <circle cx="16" cy="16" r="14" fill="none" stroke="white" stroke-width="2"/>
            <circle cx="16" cy="16" r="4" fill="white"/>
            <circle cx="16" cy="16" r="8" fill="none" stroke="white" stroke-width="1"/>
            <circle cx="16" cy="16" r="12" fill="none" stroke="white" stroke-width="1"/>
        </svg>
    </div>
    <h2>Google → DuckDuckGo</h2>
    <p>Automatically redirects Google searches to DuckDuckGo for private browsing.</p>
    <div class="status">
        <div class="indicator"></div>
        <span>Active</span>
    </div>
    <div class="links">
        <a href="options.html" target="_blank">Options</a>
        <a href="https://duckduckgo.com" target="_blank">DuckDuckGo</a>
    </div>
    <script src="popup.js"></script>
</body>
</html>
